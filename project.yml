name: StandUp
options:
  bundleIdPrefix: com.local.standup
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "2"
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    CODE_SIGN_IDENTITY: "-"
    ENABLE_HARDENED_RUNTIME: YES
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_FILE: StandUp/Info.plist
    CODE_SIGN_ENTITLEMENTS: StandUp/StandUp.entitlements
    PRODUCT_BUNDLE_IDENTIFIER: com.local.standup
    PRODUCT_NAME: StandUp
    INFOPLIST_KEY_LSUIElement: YES
    INFOPLIST_KEY_NSHumanReadableCopyright: "MIT License"
    INFOPLIST_KEY_NSBluetoothAlwaysUsageDescription: "StandUp uses Bluetooth to control your LINAK standing desk (move to sit/stand positions)."
    INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
targets:
  StandUp:
    type: application
    platform: macOS
    sources:
      - path: StandUp
        excludes:
          - "Info.plist"
          - "StandUp.entitlements"
    resources:
      - path: StandUp/Assets.xcassets